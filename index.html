<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veille Média — Luttes, transparence, démocratie</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; max-width: 100%; }
  :root {
    --paper: #f4f4ef; --surface: #ffffff; --ink: #20211f; --muted: #747770;
    --line: #dedfd8; --red: #c94f36; --red-soft: #f7e8e3;
    --green: #486f5b; --green-soft: #e8efe9; --blue: #2f6fb0; --yellow: #d5a844;
    --serif: Georgia, serif;
    --sans: -apple-system, "Segoe UI", sans-serif;
    --mono: Consolas, monospace;
  }
  html, body { overflow-x: hidden; max-width: 100vw; }
  body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--sans); min-height: 100vh; }

  header {
    background: linear-gradient(90deg, #f7f7f3, #eeefe9);
    border-bottom: 1px solid var(--line);
    padding: 16px 32px;
    display: flex; justify-content: space-between;
    align-items: center; gap: 16px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 100;
    max-width: 100vw;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand-mark { width: 36px; height: 36px; border-radius: 50%; background: var(--red); color: white; display: grid; place-items: center; font-size: 18px; flex: 0 0 auto; }
  .brand-name { font: 600 20px/1 var(--serif); }
  .brand-tag { font: 11px var(--mono); color: var(--muted); margin-top: 3px; letter-spacing: 0.5px; }

  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; max-width: 100%; }
  .searchbox { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; min-width: 200px; max-width: 100%; }
  .searchbox input { border: 0; outline: 0; background: transparent; font-size: 13px; width: 100%; color: var(--ink); min-width: 0; }
  select, button { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font-size: 13px; color: var(--ink); cursor: pointer; max-width: 100%; }
  button:hover { border-color: #999; }
  button.primary { background: var(--red); color: white; border-color: var(--red); font-weight: 600; }
  button.primary:hover { background: #ad432f; }
  button.action { font-size: 12px; padding: 6px 10px; }

  .container { max-width: 1200px; margin: 0 auto; padding: 20px 32px 60px; width: 100%; }

  .status-bar {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 16px; margin-bottom: 18px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted);
  }
  .status-bar .refresh-info { display: flex; align-items: center; gap: 8px; }
  .status-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .status-bar .dot.loading { background: var(--yellow); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.4; } }

  .stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
  .stat-label { color: var(--muted); font: 10px var(--mono); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }
  .stat-value { font: 500 22px/1 var(--serif); }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-value.blue { color: var(--blue); }
  .stat-value.yellow { color: var(--yellow); }
  .stat-value.clickable { cursor: pointer; text-decoration: underline dotted; }
  .stat-value.clickable:hover { color: var(--red); }

  .filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  .filters .filter-label { font: 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .pills { display: flex; gap: 3px; background: #f1f1ec; border-radius: 6px; padding: 3px; }
  .pills button { border: 0; padding: 5px 10px; font-size: 12px; background: transparent; border-radius: 4px; }
  .pills button.active { background: var(--ink); color: white; }

  .quick-actions { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }

  .articles { display: grid; gap: 10px; width: 100%; min-width: 0; }
  .article {
    background: var(--surface); border: 1px solid var(--line);
    border-left: 4px solid var(--line); border-radius: 8px;
    padding: 14px 16px; transition: border-color 0.15s, transform 0.15s;
    animation: arrive 0.35s ease-out;
    min-width: 0; overflow: hidden; word-wrap: break-word;
    max-width: 100%;
  }
  @keyframes arrive { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .article:hover { border-color: #b8bab2; transform: translateY(-1px); }
  .article.fresh { box-shadow: inset 0 0 0 2px var(--yellow); }
  .article.gauche { border-left-color: #c94f36; }
  .article.gauche-radicale { border-left-color: #a83322; }
  .article.centre-gauche { border-left-color: #d98a5f; }
  .article.neutre { border-left-color: #888b83; }
  .article.centre-droite { border-left-color: #6d97c9; }
  .article.droite { border-left-color: #2f6fb0; }

  .article-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font: 11px var(--mono); color: var(--muted); flex-wrap: wrap; min-width: 0; }
  .source { background: #f1f1ec; color: #555851; padding: 3px 8px; border-radius: 3px; font-weight: 600; font-size: 10px; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .source:hover { background: var(--ink); color: white; }
  .badge { padding: 3px 7px; border-radius: 3px; font-size: 10px; font-weight: 600; white-space: nowrap; flex: 0 0 auto; }
  .badge.gauche, .badge.gauche-radicale { background: var(--red-soft); color: var(--red); }
  .badge.centre-gauche { background: #fbe6d9; color: #b3612f; }
  .badge.neutre { background: #eceae3; color: #6a6d65; }
  .badge.centre-droite { background: #e3ecf5; color: #3f6d9b; }
  .badge.droite { background: #dce8f5; color: var(--blue); }
  .badge.fresh { background: var(--yellow); color: white; }
  .badge.theme { background: #eeefe9; color: #555851; }
  .badge.theme.corruption { background: var(--red-soft); color: var(--red); }
  .badge.theme.transparence { background: #e3ecf5; color: var(--blue); }

  .article-title { font: 500 18px/1.25 var(--serif); margin-bottom: 6px; color: var(--ink); text-decoration: none; display: block; word-wrap: break-word; overflow-wrap: break-word; }
  .article-title:hover { color: var(--red); }
  .article-desc { color: #686b64; font-size: 13px; line-height: 1.5; margin-bottom: 8px; word-wrap: break-word; overflow-wrap: break-word; }
  .article-foot { display: flex; gap: 8px; align-items: center; font: 10px var(--mono); color: var(--muted); flex-wrap: wrap; min-width: 0; }
  .article-foot a { color: var(--blue); text-decoration: none; word-break: break-word; }
  .article-foot a:hover { text-decoration: underline; }

  .empty { padding: 60px 20px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; }
  .empty a { color: var(--red); }

  .load-more {
    text-align: center; padding: 20px 0; margin-top: 20px;
  }
  .load-more button {
    padding: 12px 24px; background: var(--ink); color: white;
    border: 0; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .load-more button:hover { background: #000; }
  .load-more .count { color: var(--muted); font: 11px var(--mono); margin-top: 8px; }

  @media (max-width: 900px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .container { padding: 16px 16px 40px; }
    header { padding: 12px 16px; }
    .article-title { font-size: 16px; }
    .filters { padding: 10px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">📡</div>
    <div>
      <div class="brand-name">Veille Média</div>
      <div class="brand-tag">LUTTES · TRANSPARENCE · DÉMOCRATIE</div>
    </div>
  </div>
  <div class="controls">
    <div class="searchbox">🔍 <input type="text" id="search" placeholder="Rechercher..."></div>
    <select id="bord-filter">
      <option value="">Tous les bords</option>
      <option value="gauche-radicale">Gauche radicale</option>
      <option value="gauche">Gauche</option>
      <option value="centre-gauche">Centre-gauche</option>
      <option value="neutre">Neutre / Fact-check</option>
      <option value="centre-droite">Centre-droite</option>
      <option value="droite">Droite</option>
    </select>
    <select id="pays-filter">
      <option value="">Tous les pays</option>
      <option value="BE">🇧🇪 Belgique</option>
      <option value="FR">🇫🇷 France</option>
      <option value="INT">🌍 International</option>
    </select>
    <select id="langue-filter">
      <option value="">Toutes les langues</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="nl">🇳🇱 Néerlandais</option>
      <option value="en">🇬🇧 Anglais</option>
    </select>
    <button class="primary action" id="refresh">🔄 Rafraîchir</button>
  </div>
</header>

<div class="container">
  <div class="status-bar">
    <div class="refresh-info">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Chargement…</span>
    </div>
    <div>
      <button class="action" id="export-csv" style="display:none">📥 Export CSV</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">Articles</div>
      <div class="stat-value blue" id="stat-articles">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Sources actives</div>
      <div class="stat-value green" id="stat-sources">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Sources en échec</div>
      <div class="stat-value red" id="stat-ko">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Dernières 24h</div>
      <div class="stat-value yellow" id="stat-24h">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Dernières 60min</div>
      <div class="stat-value yellow" id="stat-60min">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Dernière collecte</div>
      <div class="stat-value red" id="stat-time" style="font-size:13px;padding-top:6px">—</div>
    </div>
  </div>

  <div class="filters">
    <span class="filter-label">Période</span>
    <div class="pills" id="period-pills">
      <button data-period="1">1 h</button>
      <button data-period="24" class="active">24 h</button>
      <button data-period="72">3 j</button>
      <button data-period="168">7 j</button>
      <button data-period="336">14 j</button>
    </div>
    <span class="filter-label" style="margin-left:auto">Thème</span>
    <select id="theme-filter">
      <option value="">Tous les thèmes</option>
      <option value="luttes-sociales">Luttes sociales</option>
      <option value="corruption">Corruption</option>
      <option value="transparence">Transparence</option>
      <option value="democratie">Démocratie</option>
      <option value="auto-defense">Auto-défense intellectuelle</option>
      <option value="international">International</option>
    </select>
    <span class="filter-label">Source</span>
    <select id="source-filter">
      <option value="">Toutes les sources</option>
    </select>
  </div>

  <div class="quick-actions">
    <button class="action" id="clear-filters" style="display:none">✕ Effacer les filtres</button>
    <span id="filter-summary" style="font: 11px var(--mono); color: var(--muted);"></span>
  </div>

  <div class="articles" id="articles">
    <div class="empty"><p>⏳ Chargement des articles…</p></div>
  </div>

  <div class="load-more" id="load-more" style="display:none">
    <button id="load-more-btn">Charger plus d'articles</button>
    <div class="count" id="load-more-count"></div>
  </div>
</div>

<script>
// ============================================================
// ÉTAT
// ============================================================
let allArticles = [];
let filteredArticles = [];
let displayedCount = 300;
const PAGE_SIZE = 300;

let activePeriod = 24;
let activeTheme = "";
let activeBord = "";
let activePays = "";
let activeLangue = "";
let activeSource = "";
let searchQuery = "";
let generatedAt = null;
let okSources = 0;
let koSources = 0;

// ============================================================
// UTILITAIRES
// ============================================================
function escapeHtml(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function languePriority(langue) {
  if (!langue) return 3;
  const l = langue.toLowerCase();
  if (l.startsWith("fr")) return 0;
  if (l.startsWith("nl")) return 1;
  if (l.startsWith("en")) return 2;
  return 3;
}

function timeAgo(pubDate) {
  const diff = Date.now() - pubDate;
  const min = Math.floor(diff / 60000);
  if (min < 1) return "à l'instant";
  if (min < 60) return `il y a ${min} min`;
  const h = Math.floor(min / 60);
  if (h < 24) return `il y a ${h} h`;
  const d = Math.floor(h / 24);
  return `il y a ${d} j`;
}

function isFresh(pubDate) {
  return (Date.now() - pubDate) < 30 * 60 * 1000; // 30 minutes
}

// ============================================================
// FILTRAGE ET RENDU
// ============================================================
function applyFilters() {
  const now = Date.now();
  const maxAgeMs = activePeriod * 3600 * 1000;

  filteredArticles = allArticles.filter(a => {
    if (activePeriod < 99999 && now - a.pubDate > maxAgeMs) return false;
    if (activeBord && a.bord !== activeBord) return false;
    if (activePays && a.pays !== activePays) return false;
    if (activeLangue && !(a.langue || "").toLowerCase().startsWith(activeLangue)) return false;
    if (activeTheme && !(a.themes || []).includes(activeTheme)) return false;
    if (activeSource && a.source !== activeSource) return false;
    if (searchQuery) {
      const text = (a.title + " " + a.source + " " + (a.description || "")).toLowerCase();
      if (!text.includes(searchQuery.toLowerCase())) return false;
    }
    return true;
  });

  filteredArticles.sort((a, b) => {
    const lp = languePriority(a.langue) - languePriority(b.langue);
    if (lp !== 0) return lp;
    return b.pubDate - a.pubDate;
  });

  displayedCount = PAGE_SIZE;
  render();
  updateFilterSummary();
  updateExportButton();
}

function render() {
  const container = document.getElementById("articles");
  const shown = filteredArticles.slice(0, displayedCount);

  if (!shown.length) {
    container.innerHTML = `<div class="empty">
      <p>Aucun article ne correspond à ces filtres.</p>
      <p style="margin-top:8px;font-size:12px">Essaie d'élargir la période ou de retirer un filtre.</p>
    </div>`;
    document.getElementById("load-more").style.display = "none";
    return;
  }

  container.innerHTML = shown.map(a => {
    const date = new Date(a.pubDate);
    const dateStr = date.toLocaleDateString("fr-FR", { day: "2-digit", month: "short" }) + " " +
                    date.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    const bordLabel = (a.bord || "neutre").replace("-", " ");
    const flag = a.pays === "BE" ? "🇧🇪" : a.pays === "FR" ? "🇫🇷" : "🌍";
    const desc = a.description ? `<p class="article-desc">${escapeHtml(a.description)}</p>` : "";
    const themes = (a.themes || []).map(t =>
      `<span class="badge theme ${t === 'corruption' ? 'corruption' : t === 'transparence' ? 'transparence' : ''}">${escapeHtml(t)}</span>`
    ).join("");
    const fresh = isFresh(a.pubDate);
    const freshBadge = fresh ? `<span class="badge fresh">🆕 NOUVEAU</span>` : "";
    const link = a.link;

    return `
      <article class="article ${escapeHtml(a.bord || "neutre")}${fresh ? " fresh" : ""}">
        <div class="article-head">
          <span class="source" data-source="${escapeHtml(a.source)}" title="Filtrer par cette source">${flag} ${escapeHtml(a.source)}</span>
          <span class="badge ${escapeHtml(a.bord || "neutre")}">${escapeHtml(bordLabel)}</span>
          ${freshBadge}
          <span style="margin-left:auto;white-space:nowrap" title="${dateStr}">${timeAgo(a.pubDate)}</span>
        </div>
        <a class="article-title" href="${escapeHtml(link)}" target="_blank" rel="noreferrer">${escapeHtml(a.title)}</a>
        ${desc}
        <div class="article-foot">
          <a href="${escapeHtml(link)}" target="_blank" rel="noreferrer">Ouvrir la source ↗</a>
          ${themes}
        </div>
      </article>
    `;
  }).join("");

  // Gestion du bouton "Charger plus"
  const loadMore = document.getElementById("load-more");
  if (filteredArticles.length > displayedCount) {
    loadMore.style.display = "block";
    document.getElementById("load-more-count").textContent =
      `Affichage de ${displayedCount} articles sur ${filteredArticles.length}`;
  } else {
    loadMore.style.display = "none";
  }

  // Attacher les clics sur les sources
  document.querySelectorAll(".source[data-source]").forEach(el => {
    el.addEventListener("click", () => {
      const sourceName = el.getAttribute("data-source");
      activeSource = sourceName;
      document.getElementById("source-filter").value = sourceName;
      applyFilters();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });
}

function updateFilterSummary() {
  const parts = [];
  if (activePeriod < 99999) parts.push(`période ${activePeriod}h`);
  if (activeTheme) parts.push(`thème : ${activeTheme}`);
  if (activeBord) parts.push(`bord : ${activeBord}`);
  if (activePays) parts.push(`pays : ${activePays}`);
  if (activeLangue) parts.push(`langue : ${activeLangue}`);
  if (activeSource) parts.push(`source : ${activeSource}`);
  if (searchQuery) parts.push(`recherche : "${searchQuery}"`);

  const summary = document.getElementById("filter-summary");
  const clearBtn = document.getElementById("clear-filters");

  if (parts.length) {
    summary.textContent = `${filteredArticles.length} articles · ${parts.join(" · ")}`;
    clearBtn.style.display = "inline-block";
  } else {
    summary.textContent = `${filteredArticles.length} articles affichables`;
    clearBtn.style.display = "none";
  }
}

function updateExportButton() {
  const btn = document.getElementById("export-csv");
  if (filteredArticles.length > 0) {
    btn.style.display = "inline-block";
    btn.textContent = `📥 Export CSV (${filteredArticles.length})`;
  } else {
    btn.style.display = "none";
  }
}

// ============================================================
// STATISTIQUES
// ============================================================
function updateStats() {
  document.getElementById("stat-articles").textContent = allArticles.length;
  document.getElementById("stat-sources").textContent = okSources;
  document.getElementById("stat-ko").textContent = koSources;

  const now = Date.now();
  const last24h = allArticles.filter(a => now - a.pubDate < 24 * 3600 * 1000).length;
  const last60min = allArticles.filter(a => now - a.pubDate < 3600 * 1000).length;

  document.getElementById("stat-24h").textContent = last24h;
  document.getElementById("stat-60min").textContent = last60min;

  if (generatedAt) {
    const d = new Date(generatedAt);
    document.getElementById("stat-time").textContent =
      d.toLocaleDateString("fr-FR", { day: "2-digit", month: "short" }) + " " +
      d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  }
}

// ============================================================
// PEUPLEMENT DU FILTRE SOURCES
// ============================================================
function populateSourceFilter() {
  const sourceFilter = document.getElementById("source-filter");
  const sources = [...new Set(allArticles.map(a => a.source))].sort((a, b) => a.localeCompare(b, "fr"));

  sourceFilter.innerHTML = `<option value="">Toutes les sources (${sources.length})</option>` +
    sources.map(s => {
      const count = allArticles.filter(a => a.source === s).length;
      return `<option value="${escapeHtml(s)}">${escapeHtml(s)} (${count})</option>`;
    }).join("");
}

// ============================================================
// CHARGEMENT
// ============================================================
async function loadArticles(showLoading = false) {
  const statusDot = document.getElementById("status-dot");
  const statusText = document.getElementById("status-text");

  if (showLoading) {
    statusDot.classList.add("loading");
    statusText.textContent = "Rafraîchissement…";
  }

  try {
    const res = await fetch("articles.json?t=" + Date.now());
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    allArticles = data.articles || [];
    generatedAt = data.generatedAt;
    okSources = data.okSources || 0;
    koSources = data.koSources || 0;

    updateStats();
    populateSourceFilter();
    applyFilters();

    const d = new Date(generatedAt);
    statusDot.classList.remove("loading");
    statusText.textContent = `Dernière collecte : ${d.toLocaleDateString("fr-FR", { day: "2-digit", month: "short" })} à ${d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}`;
  } catch (err) {
    statusDot.classList.remove("loading");
    statusText.textContent = "Erreur de chargement : " + err.message;
  }
}

// ============================================================
// EXPORT CSV
// ============================================================
function exportCSV() {
  const headers = ["Date", "Source", "Bord", "Pays", "Langue", "Titre", "Thèmes", "URL"];
  const rows = filteredArticles.map(a => [
    new Date(a.pubDate).toISOString(),
    a.source,
    a.bord,
    a.pays,
    a.langue,
    a.title,
    (a.themes || []).join("; "),
    a.link,
  ]);

  const csv = [headers, ...rows]
    .map(row => row.map(cell => `"${String(cell ?? "").replace(/"/g, '""')}"`).join(","))
    .join("\r\n");

  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `veille-media-${new Date().toISOString().slice(0, 10)}.csv`;
  link.click();
  URL.revokeObjectURL(link.href);
}

// ============================================================
// ÉVÉNEMENTS
// ============================================================
document.getElementById("search").addEventListener("input", e => {
  searchQuery = e.target.value;
  applyFilters();
});

document.getElementById("bord-filter").addEventListener("change", e => {
  activeBord = e.target.value;
  applyFilters();
});

document.getElementById("pays-filter").addEventListener("change", e => {
  activePays = e.target.value;
  applyFilters();
});

document.getElementById("langue-filter").addEventListener("change", e => {
  activeLangue = e.target.value;
  applyFilters();
});

document.getElementById("theme-filter").addEventListener("change", e => {
  activeTheme = e.target.value;
  applyFilters();
});

document.getElementById("source-filter").addEventListener("change", e => {
  activeSource = e.target.value;
  applyFilters();
});

document.getElementById("period-pills").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const period = Number(btn.dataset.period);
  if (!period) return;
  document.querySelectorAll("#period-pills button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  activePeriod = period;
  applyFilters();
});

document.getElementById("clear-filters").addEventListener("click", () => {
  activeTheme = "";
  activeBord = "";
  activePays = "";
  activeLangue = "";
  activeSource = "";
  searchQuery = "";
  document.getElementById("search").value = "";
  document.getElementById("theme-filter").value = "";
  document.getElementById("bord-filter").value = "";
  document.getElementById("pays-filter").value = "";
  document.getElementById("langue-filter").value = "";
  document.getElementById("source-filter").value = "";
  applyFilters();
});

document.getElementById("refresh").addEventListener("click", () => {
  loadArticles(true);
});

document.getElementById("export-csv").addEventListener("click", exportCSV);

document.getElementById("load-more-btn").addEventListener("click", () => {
  displayedCount += PAGE_SIZE;
  render();
});

// ============================================================
// DÉMARRAGE
// ============================================================
loadArticles();
setInterval(() => loadArticles(false), 5 * 60 * 1000);
</script>

</body>
</html>
