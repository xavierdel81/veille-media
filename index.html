<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veille Média — Luttes, transparence, démocratie</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; max-width: 100%; }
  :root {
    --paper: #f4f4ef; --surface: #ffffff; --ink: #20211f; --muted: #747770;
    --line: #dedfd8; --red: #c94f36; --red-soft: #f7e8e3;
    --green: #486f5b; --green-soft: #e8efe9; --blue: #2f6fb0; --yellow: #d5a844;
    --serif: Georgia, serif;
    --sans: -apple-system, "Segoe UI", sans-serif;
    --mono: Consolas, monospace;
  }
  html, body { overflow-x: hidden; max-width: 100vw; }
  body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--sans); min-height: 100vh; }

  header {
    background: linear-gradient(90deg, #f7f7f3, #eeefe9);
    border-bottom: 1px solid var(--line);
    padding: 18px 32px;
    display: flex; justify-content: space-between;
    align-items: center; gap: 20px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 100;
    max-width: 100vw;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand-mark { width: 36px; height: 36px; border-radius: 50%; background: var(--red); color: white; display: grid; place-items: center; font-size: 18px; flex: 0 0 auto; }
  .brand-name { font: 600 20px/1 var(--serif); }
  .brand-tag { font: 11px var(--mono); color: var(--muted); margin-top: 3px; letter-spacing: 0.5px; }

  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; max-width: 100%; }
  .searchbox { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; min-width: 200px; max-width: 100%; }
  .searchbox input { border: 0; outline: 0; background: transparent; font-size: 13px; width: 100%; color: var(--ink); min-width: 0; }
  select, button { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; font-size: 13px; color: var(--ink); cursor: pointer; max-width: 100%; }
  button:hover { border-color: #999; }

  .container { max-width: 1200px; margin: 0 auto; padding: 24px 32px 60px; width: 100%; }
  .intro { margin-bottom: 22px; }
  .intro h1 { font: 500 34px/1.1 var(--serif); margin-bottom: 6px; }
  .intro p { color: var(--muted); font-size: 13px; }

  .stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; margin-bottom: 26px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; min-width: 0; }
  .stat-label { color: var(--muted); font: 10px var(--mono); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; }
  .stat-value { font: 500 26px/1 var(--serif); }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-value.blue { color: var(--blue); }
  .stat-value.yellow { color: var(--yellow); }

  .filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
  .filters .filter-label { font: 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .pills { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px; }
  .pills button { border: 0; padding: 6px 12px; font-size: 12px; background: transparent; border-radius: 4px; }
  .pills button.active { background: var(--ink); color: white; }

  .articles { display: grid; gap: 12px; width: 100%; min-width: 0; }
  .article {
    background: var(--surface); border: 1px solid var(--line);
    border-left: 4px solid var(--line); border-radius: 8px;
    padding: 16px 18px; transition: border-color 0.15s, transform 0.15s;
    animation: arrive 0.35s ease-out;
    min-width: 0; overflow: hidden; word-wrap: break-word;
    max-width: 100%;
  }
  @keyframes arrive { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .article:hover { border-color: #b8bab2; transform: translateY(-1px); }
  .article.gauche { border-left-color: #c94f36; }
  .article.gauche-radicale { border-left-color: #a83322; }
  .article.centre-gauche { border-left-color: #d98a5f; }
  .article.neutre { border-left-color: #888b83; }
  .article.centre-droite { border-left-color: #6d97c9; }
  .article.droite { border-left-color: #2f6fb0; }

  .article-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font: 11px var(--mono); color: var(--muted); flex-wrap: wrap; min-width: 0; }
  .source { background: #f1f1ec; color: #555851; padding: 3px 8px; border-radius: 3px; font-weight: 600; font-size: 10px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { padding: 3px 7px; border-radius: 3px; font-size: 10px; font-weight: 600; white-space: nowrap; flex: 0 0 auto; }
  .badge.gauche, .badge.gauche-radicale { background: var(--red-soft); color: var(--red); }
  .badge.centre-gauche { background: #fbe6d9; color: #b3612f; }
  .badge.neutre { background: #eceae3; color: #6a6d65; }
  .badge.centre-droite { background: #e3ecf5; color: #3f6d9b; }
  .badge.droite { background: #dce8f5; color: var(--blue); }

  .article-title { font: 500 19px/1.25 var(--serif); margin-bottom: 6px; color: var(--ink); text-decoration: none; display: block; word-wrap: break-word; overflow-wrap: break-word; }
  .article-title:hover { color: var(--red); }
  .article-desc { color: #686b64; font-size: 13px; line-height: 1.5; margin-bottom: 10px; word-wrap: break-word; overflow-wrap: break-word; }
  .article-foot { display: flex; gap: 8px; align-items: center; font: 10px var(--mono); color: var(--muted); flex-wrap: wrap; min-width: 0; }
  .article-foot a { color: var(--blue); text-decoration: none; word-break: break-word; }
  .article-foot a:hover { text-decoration: underline; }

  .empty { padding: 60px 20px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; }
  .empty a { color: var(--red); }

  @media (max-width: 900px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .container { padding: 18px 16px 40px; }
    header { padding: 14px 16px; }
    .intro h1 { font-size: 26px; }
    .article-title { font-size: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">📡</div>
    <div>
      <div class="brand-name">Veille Média</div>
      <div class="brand-tag">LUTTES · TRANSPARENCE · DÉMOCRATIE</div>
    </div>
  </div>
  <div class="controls">
    <div class="searchbox">🔍 <input type="text" id="search" placeholder="Rechercher..."></div>
    <select id="bord-filter">
      <option value="">Tous les bords</option>
      <option value="gauche-radicale">Gauche radicale</option>
      <option value="gauche">Gauche</option>
      <option value="centre-gauche">Centre-gauche</option>
      <option value="neutre">Neutre / Fact-check</option>
      <option value="centre-droite">Centre-droite</option>
      <option value="droite">Droite</option>
    </select>
    <select id="pays-filter">
      <option value="">Tous les pays</option>
      <option value="BE">🇧🇪 Belgique</option>
      <option value="FR">🇫🇷 France</option>
      <option value="INT">🌍 International</option>
    </select>
    <select id="langue-filter">
      <option value="">Toutes les langues</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="nl">🇳🇱 Néerlandais</option>
      <option value="en">🇬🇧 Anglais</option>
    </select>
  </div>
</header>

<div class="container">
  <div class="intro">
    <h1>Le fil de la veille.</h1>
    <p>Médias francophones en priorité, puis néerlandophones, puis anglophones.</p>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">Articles</div><div class="stat-value blue" id="stat-articles">—</div></div>
    <div class="stat"><div class="stat-label">Sources actives</div><div class="stat-value green" id="stat-sources">—</div></div>
    <div class="stat"><div class="stat-label">Sources en échec</div><div class="stat-value red" id="stat-ko">—</div></div>
    <div class="stat"><div class="stat-label">Thèmes détectés</div><div class="stat-value yellow" id="stat-themes">—</div></div>
    <div class="stat"><div class="stat-label">Dernière collecte</div><div class="stat-value red" id="stat-time" style="font-size:15px;padding-top:8px">—</div></div>
  </div>

  <div class="filters">
    <span class="filter-label">Période</span>
    <div class="pills" id="period-pills">
      <button data-period="24" class="active">24 h</button>
      <button data-period="168">7 j</button>
      <button data-period="720">30 j</button>
      <button data-period="99999">Tout</button>
    </div>
    <span class="filter-label" style="margin-left:auto">Thème</span>
    <select id="theme-filter">
      <option value="">Tous les thèmes</option>
      <option value="luttes-sociales">Luttes sociales</option>
      <option value="corruption">Corruption</option>
      <option value="transparence">Transparence</option>
      <option value="democratie">Démocratie</option>
      <option value="auto-defense">Auto-défense intellectuelle</option>
      <option value="international">International</option>
    </select>
  </div>

  <div class="articles" id="articles">
    <div class="empty"><p>⏳ Chargement des articles…</p></div>
  </div>
</div>

<script>
// ============================================================
// ÉTAT
// ============================================================
let articles = [];
let activePeriod = 24;
let activeTheme = "";
let activeBord = "";
let activePays = "";
let activeLangue = "";
let searchQuery = "";
let generatedAt = null;
let okSources = 0;
let koSources = 0;

// ============================================================
// UTILITAIRES
// ============================================================
function escapeHtml(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function languePriority(langue) {
  if (!langue) return 3;
  const l = langue.toLowerCase();
  if (l.startsWith("fr")) return 0;
  if (l.startsWith("nl")) return 1;
  if (l.startsWith("en")) return 2;
  return 3;
}

// ============================================================
// RENDER
// ============================================================
function render() {
  const container = document.getElementById("articles");
  const now = Date.now();
  const maxAgeMs = activePeriod * 3600 * 1000;

  const filtered = articles.filter(a => {
    if (activePeriod < 99999 && now - a.pubDate > maxAgeMs) return false;
    if (activeBord && a.bord !== activeBord) return false;
    if (activePays && a.pays !== activePays) return false;
    if (activeLangue && !(a.langue || "").toLowerCase().startsWith(activeLangue)) return false;
    if (activeTheme && !(a.themes || []).includes(activeTheme)) return false;
    if (searchQuery) {
      const text = (a.title + " " + a.source + " " + (a.description || "")).toLowerCase();
      if (!text.includes(searchQuery.toLowerCase())) return false;
    }
    return true;
  });

  filtered.sort((a, b) => {
    const lp = languePriority(a.langue) - languePriority(b.langue);
    if (lp !== 0) return lp;
    return b.pubDate - a.pubDate;
  });

  const shown = filtered.slice(0, 200);

  if (!shown.length) {
    container.innerHTML = `<div class="empty">
      <p>Aucun article ne correspond à ces filtres.</p>
      <p style="margin-top:8px;font-size:12px">Essaie d'élargir la période ou de retirer un filtre.</p>
    </div>`;
    return;
  }

  container.innerHTML = shown.map(a => {
    const date = new Date(a.pubDate);
    const dateStr = date.toLocaleDateString("fr-FR", { day: "2-digit", month: "short" }) + " " +
                    date.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    const bordLabel = (a.bord || "neutre").replace("-", " ");
    const flag = a.pays === "BE" ? "🇧🇪" : a.pays === "FR" ? "🇫🇷" : "🌍";
    const desc = a.description ? `<p class="article-desc">${escapeHtml(a.description)}</p>` : "";
    const themes = (a.themes || []).map(t => `<span>· ${escapeHtml(t)}</span>`).join("");
    return `
      <article class="article ${escapeHtml(a.bord || "neutre")}">
        <div class="article-head">
          <span class="source">${flag} ${escapeHtml(a.source)}</span>
          <span class="badge ${escapeHtml(a.bord || "neutre")}">${escapeHtml(bordLabel)}</span>
          <span style="margin-left:auto;white-space:nowrap">${dateStr}</span>
        </div>
        <a class="article-title" href="${escapeHtml(a.link)}" target="_blank" rel="noreferrer">${escapeHtml(a.title)}</a>
        ${desc}
        <div class="article-foot">
          <a href="${escapeHtml(a.link)}" target="_blank" rel="noreferrer">Ouvrir la source ↗</a>
          ${themes}
        </div>
      </article>
    `;
  }).join("");
}

function updateStats() {
  const themesFound = new Set();
  articles.forEach(a => (a.themes || []).forEach(t => themesFound.add(t)));
  document.getElementById("stat-articles").textContent = articles.length;
  document.getElementById("stat-sources").textContent = okSources;
  document.getElementById("stat-ko").textContent = koSources;
  document.getElementById("stat-themes").textContent = themesFound.size;
  if (generatedAt) {
    const d = new Date(generatedAt);
    document.getElementById("stat-time").textContent =
      d.toLocaleDateString("fr-FR", { day: "2-digit", month: "short" }) + " " +
      d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  }
}

// ============================================================
// CHARGEMENT
// ============================================================
async function loadArticles() {
  try {
    const res = await fetch("articles.json?t=" + Date.now());
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    articles = data.articles || [];
    generatedAt = data.generatedAt;
    okSources = data.okSources || 0;
    koSources = data.koSources || 0;
    updateStats();
    render();
  } catch (err) {
    document.getElementById("articles").innerHTML = `<div class="empty">
      <p>⏳ Aucun articles.json trouvé pour le moment.</p>
    </div>`;
  }
}

// ============================================================
// ÉVÉNEMENTS (après définition de toutes les fonctions)
// ============================================================

const searchInput = document.getElementById("search");
if (searchInput) {
  searchInput.addEventListener("input", e => {
    searchQuery = e.target.value;
    render();
  });
}

const bordFilter = document.getElementById("bord-filter");
if (bordFilter) {
  bordFilter.addEventListener("change", e => {
    activeBord = e.target.value;
    render();
  });
}

const paysFilter = document.getElementById("pays-filter");
if (paysFilter) {
  paysFilter.addEventListener("change", e => {
    activePays = e.target.value;
    render();
  });
}

const langueFilter = document.getElementById("langue-filter");
if (langueFilter) {
  langueFilter.addEventListener("change", e => {
    activeLangue = e.target.value;
    render();
  });
}

const themeFilter = document.getElementById("theme-filter");
if (themeFilter) {
  themeFilter.addEventListener("change", e => {
    activeTheme = e.target.value;
    render();
  });
}

// Boutons de période : délégation d'événement
const periodPills = document.getElementById("period-pills");
if (periodPills) {
  periodPills.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    const period = Number(btn.dataset.period);
    if (!period) return;
    periodPills.querySelectorAll("button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activePeriod = period;
    render();
  });
}

// Démarrage
loadArticles();
setInterval(loadArticles, 10 * 60 * 1000);
</script>

</body>
</html>
