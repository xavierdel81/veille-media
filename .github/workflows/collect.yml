name: Collecte des flux RSS

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Empêche 2 workflows de tourner en même temps
concurrency:
  group: collect-rss
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installation de Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Collecte des flux
        run: node collector.mjs

      - name: Commit et push des résultats
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add articles.json
          if git diff --staged --quiet; then
            echo "Aucun changement à committer"
            exit 0
          fi
          git commit -m "Mise à jour articles.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # Récupère les changements distants et rejoue notre commit par-dessus
          git pull --rebase origin main
          git push
